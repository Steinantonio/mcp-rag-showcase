name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Architecture boundary
        run: lint-imports

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        run: dotnet test --nologo

  parity:
    name: parity
    runs-on: ubuntu-latest
    needs: [python, dotnet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install python
        run: pip install -e ".[dev]"
      - name: Build .NET (Debug, so `dotnet run --no-build` finds it)
        run: dotnet build src/Mcp.Rag.Dotnet
      - name: Same queries, both engines
        run: python tests/conformance/parity_runner.py

  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-pull base images (Docker Hub flakes are not our bugs)
        run: |
          for image in python:3.12-slim mcr.microsoft.com/dotnet/sdk:10.0 mcr.microsoft.com/dotnet/runtime:10.0; do
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then break; fi
              echo "pull failed for $image (attempt $attempt), retrying"
              sleep 5
            done
          done
      - name: Build and start
        run: docker compose up --build -d
      - name: Wait for both health endpoints
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo "both services healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become healthy"
          docker compose ps
          exit 1
      - name: Same query, both containers, over MCP
        run: pwsh ./scripts/smoke.ps1
      - name: Memory footprint
        run: docker stats --no-stream
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  iac:
    name: iac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
      - name: Validate Bicep (never deploys)
        run: ./bicep build infra/main.bicep --stdout > /dev/null
      - name: Validate compose file
        run: docker compose config -q
