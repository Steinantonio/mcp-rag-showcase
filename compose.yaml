# Both services, one query, side by side.
# Corpus is mounted read-only: the images bake a copy, compose replaces it for local iteration.

services:
  rag-py:
    build:
      context: .
      dockerfile: infra/Dockerfile.py
    image: mcp-rag-showcase/py:local
    ports:
      - "8080:8080"
    environment:
      MCP_RAG_CORPUS: /app/corpus
    volumes:
      - ./corpus:/app/corpus:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  rag-net:
    build:
      context: .
      dockerfile: infra/Dockerfile.net
    image: mcp-rag-showcase/net:local
    ports:
      - "8081:8081"
    environment:
      MCP_RAG_CORPUS: /app/corpus
    volumes:
      - ./corpus:/app/corpus:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
