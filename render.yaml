# Render blueprint — free tier, single service.
# Reuses the same Dockerfile as docker compose, so there is one build definition.
# The corpus is baked into the image; the only variable is PORT, which Render injects.

services:
  - type: web
    name: mcp-rag-showcase
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/Dockerfile.py
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
