# Render blueprint — free tier, single service.
# Reuses the same Dockerfile as docker compose, so there is one build definition.
# No secrets and no env vars beyond PORT: the corpus is baked into the image.

services:
  - type: web
    name: mcp-rag-showcase
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/Dockerfile.py
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT; the app must bind 0.0.0.0 and read it. Kept explicit for local parity.
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
