[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rag-py"
version = "0.1.0"
description = "Retrieval core and protocol surfaces for mcp-rag-showcase"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "import-linter>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-rag-py = "mcp_rag_py.apps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.importlinter]
root_package = "mcp_rag_py"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is pure: no adapters, no apps, no frameworks, no I/O"
type = "forbidden"
source_modules = ["mcp_rag_py.core"]
forbidden_modules = [
    "mcp_rag_py.adapters",
    "mcp_rag_py.apps",
    "fastapi",
    "starlette",
    "pydantic",
    "mcp",
    "httpx",
    "os",
    "pathlib",
    "sys",
    "time",
    "random",
]
